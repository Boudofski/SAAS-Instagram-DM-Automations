name: Automation follow-ups
on:
  # QStash handles normal recurring wake-ups. This bounded schedule is an
  # incident fallback for the 2026-10-31 recovery queue only.
  schedule:
    - cron: "*/5 19-23 31 10 *"
  workflow_dispatch:
permissions:
  id-token: write
concurrency:
  group: automation-follow-ups
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'Boudofski/SAAS-Instagram-DM-Automations' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process due reminders with a short-lived identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%F)" != "2026-10-31" ]]; then
            exit 0
          fi
          audience='https://ap3k.com/api/cron/automation-follow-ups'
          encoded_audience=$(printf '%s' "$audience" | jq -sRr @uri)
          identity=$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$encoded_audience" | jq -er '.value')
          echo "::add-mask::$identity"
          curl --fail --silent --show-error --max-time 70 \
            -H "Authorization: Bearer $identity" "$audience"
