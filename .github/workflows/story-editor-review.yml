name: Story editor review
on:
  push:
    branches: [fix/story-automation-parity-20261004]
    paths: [.github/workflows/story-editor-review.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Package dependencies for isolated tests
        run: |
          mkdir -p /tmp/ap3k-story-review
          tar -czf /tmp/ap3k-story-review/node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: ap3k-story-review-dependencies
          path: /tmp/ap3k-story-review/node_modules.tar.gz
          compression-level: 0
          retention-days: 1
