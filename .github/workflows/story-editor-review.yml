name: Story editor review
on:
  push:
    branches: [fix/story-automation-parity-20261004]
    paths: [.github/workflows/story-editor-review.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Package source checkpoint for isolated Story review
        run: |
          mkdir -p /tmp/ap3k-story-review
          tar --exclude=node_modules --exclude=.next -czf /tmp/ap3k-story-review/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ap3k-story-review-source
          path: /tmp/ap3k-story-review/source.tar.gz
          compression-level: 0
          retention-days: 1
