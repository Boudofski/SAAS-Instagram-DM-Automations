name: SEO source checkpoint
on:
  push:
    branches: [seo/claude-audit-20261005]
    paths: [.github/workflows/seo-review.yml]
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export source changes for local verification
        run: |
          mkdir -p /tmp/seo-checkpoint
          git diff --binary 3ff7f2879d31931df3a68f3ae66d69bccc841e2c HEAD -- app actions components constants lib hooks providers prisma scripts next.config.mjs next.config.js package.json package-lock.json public > /tmp/seo-checkpoint/source.patch
          git rev-parse HEAD > /tmp/seo-checkpoint/head.txt
          git diff --stat 047052a6796fea966495ac53267bcc02d6d315ea HEAD > /tmp/seo-checkpoint/changes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ap3k-seo-checkpoint
          path: /tmp/seo-checkpoint
          retention-days: 7
