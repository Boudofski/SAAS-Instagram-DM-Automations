<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP3K responsive review</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:8px;display:flex;gap:8px;position:sticky;top:0;background:#ddd;z-index:2}button,select{padding:8px}iframe{display:block;border:0;margin:auto;background:white;height:1000px;max-width:100%}</style></head><body><header><button data-width="1280">Desktop 1280</button><button data-width="768">Tablet 768</button><button data-width="390">Mobile 390</button><button data-width="320">Mobile 320</button><select aria-label="Language"><option value="/">English</option><option value="/fr">French</option><option value="/de">German</option><option value="/es">Spanish</option><option value="/pt">Portuguese</option></select></header><iframe title="Homepage preview" width="1280" src="/"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(b=>b.onclick=()=>frame.width=b.dataset.width);document.querySelector('select').onchange=e=>frame.src=e.target.value;</script></body></html>
