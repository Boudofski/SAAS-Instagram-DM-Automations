  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);

  grid-template-rows: auto 1fr auto;
  gap: 20px 16px;
  min-width: 0;
}
.ap3k-feature-intro { grid-area: intro; }
.ap3k-feature-benefits { grid-area: benefits; }
.ap3k-feature-cta { grid-area: cta; align-self: start; }
.ap3k-feature-cta a { width: 100%; }
.ap3k-feature-phone { grid-area: phone; width: min(100%, 185px); }
