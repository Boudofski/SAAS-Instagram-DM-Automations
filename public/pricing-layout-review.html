<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AP3K responsive review</title><style>body{margin:0;background:#80818b;font:14px Arial}header{display:flex;gap:16px;align-items:center;padding:12px;background:#17151e;color:white}iframe{display:block;border:0;margin:16px auto;background:white;height:850px;max-width:none}label{display:flex;gap:8px}</style></head><body><header><strong>Responsive review</strong><label>Width<select id="width"><option>320</option><option>390</option><option>768</option><option>1440</option></select></label><label>Theme<select id="theme"><option>light</option><option>dark</option></select></label><label>Page<select id="page"><option value="/pricing">Pricing</option><option value="/blog">Blog</option><option value="/fr/pricing">French pricing</option></select></label></header><iframe title="AP3K responsive preview" id="preview"></iframe><script>const p=new URLSearchParams(location.search);const w=document.getElementById('width'),t=document.getElementById('theme'),s=document.getElementById('page'),f=document.getElementById('preview');w.value=p.get('width')||'390';t.value=p.get('theme')||'dark';s.value=p.get('path')||'/pricing';function update(){localStorage.setItem('theme',t.value);f.style.width=w.value+'px';f.src=s.value+'?review='+Date.now()}w.onchange=update;t.onchange=update;s.onchange=update;update();</script></body></html>
